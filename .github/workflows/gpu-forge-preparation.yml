name: GPU FORGE G03 preparation (CPU only, no model or cloud instance)
on:
  push:
    branches: ['codex/gpu-forge-g03-preparation-*']
    paths: ['tooling/gpu_forge/**', 'datasets/gpu-forge/**', 'docs/gpu-forge/**', '.github/workflows/gpu-forge-preparation.yml']
  pull_request:
    paths: ['tooling/gpu_forge/**', 'datasets/gpu-forge/**', 'docs/gpu-forge/**', '.github/workflows/gpu-forge-preparation.yml']
permissions:
  contents: read
jobs:
  preparation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tooling/gpu_forge/tests -v
      - run: python3 scripts/validate_unified.py
      - run: python3 -m unittest discover -s tests -v
      - run: python3 -m unittest discover -s registry/tests -v
      - name: Record preparation without executing inference
        run: python3 -m tooling.gpu_forge.preparation > "${{ runner.temp }}/g03-preparation.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gpu-forge-g03-preparation-${{ github.sha }}
          path: ${{ runner.temp }}/g03-preparation.json
          if-no-files-found: error
          retention-days: 90
