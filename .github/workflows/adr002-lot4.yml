name: ADR002 lot4 isolated offline contract gate
on:
  push:
    branches: ['feat/lot4-offline-recovery-*']
  pull_request:
    branches: ['mission/adr002-principles-lot4-20261028']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.12'
      - name: ADR002 strict two-owner synthetic safety tests
        run: python3 -m unittest discover -s tooling/integration/adr002_lot4_tests -v
      - name: Retain U01 receipt refusals
        run: python3 -m unittest discover -s tooling/integration/uni08_u01_tests -v
      - name: Preserve workspace OFF gates
        run: |
          python3 workspace/check_plan.py workspace/modular-workspace.proposed.json
          python3 -m unittest discover -s workspace/tests -v
