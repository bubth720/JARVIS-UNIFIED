name: Validate UNIFIED coordination
on:
  pull_request:
  workflow_dispatch:
    inputs:
      live:
        description: Optional read-only GitHub API snapshot
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate_unified.py
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s registry/tests -v
      - run: python -m unittest discover -s tooling/campaign/tests -v
      - run: python -m unittest discover -s tooling/integration/tests -v
      - run: python -m tooling.integration.cli validate
      - run: python -m tooling.integration.cli proposals
      - name: Check generated candidate report
        run: |
          python -m tooling.integration.cli report > /tmp/fusion-bom.md
          diff -u docs/fusion-01/BOM.md /tmp/fusion-bom.md
      - run: python scripts/audit_repos.py --offline --output-dir reports/ci-offline
      - uses: actions/upload-artifact@v4
        with:
          name: offline-audit-synthetic
          path: reports/ci-offline/
  backup-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Existing Mission002 dependency only; new audit/contracts use stdlib.
      - run: 'python -m pip install --only-binary=:all: -r backup_prototype/requirements.txt'
      - run: python -m unittest discover -s backup_prototype/tests -v
  live-read-only:
    if: github.event_name == 'workflow_dispatch' && inputs.live
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/audit_repos.py --online --token-env GITHUB_TOKEN --output-dir reports/live
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-audit-read-only
          path: reports/live/
          if-no-files-found: warn
