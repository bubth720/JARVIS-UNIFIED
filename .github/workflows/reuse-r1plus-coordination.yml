name: REUSE R1plus documentary qualification
on:
  push:
    branches: [codex/reuse-first-r1plus-20261108]
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
  REUSE_COORDINATION_EVIDENCE: ${{ runner.temp }}/reuse-r1plus-coordination
jobs:
  coordination:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Verify historical coordination, actual receipts and no promotion
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$REUSE_COORDINATION_EVIDENCE"
          {
            python3 scripts/validate_unified.py
            python3 -m unittest discover -s tests -v
            python3 -m unittest discover -s registry/tests -v
            python3 -m unittest discover -s tooling/campaign/tests -v
            python3 -m unittest discover -s tooling/integration/tests -v
            python3 -m unittest discover -s tooling/v1/tests -v
            python3 -m tooling.v1.validate
            python3 -m tooling.v1.reception
            python3 -m tooling.reuse_r1plus.verify
            python3 -m unittest discover -s tooling/reuse_r1plus/tests -v
          } 2>&1 | tee "$REUSE_COORDINATION_EVIDENCE/results.log"
      - name: Preserve source and exact artifact digests
        if: always()
        run: |
          git rev-parse HEAD > "$REUSE_COORDINATION_EVIDENCE/source.txt"
          git rev-parse HEAD^{tree} > "$REUSE_COORDINATION_EVIDENCE/tree.txt"
          sha256sum reports/reuse-first-r1plus/RECEIPT.json reports/reuse-first-r1plus/EVIDENCE-SHA256.json > "$REUSE_COORDINATION_EVIDENCE/SHA256SUMS"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: REUSE-R1plus-coordination-${{ github.sha }}
          path: ${{ env.REUSE_COORDINATION_EVIDENCE }}/
          retention-days: 90
