name: JARVIS INTEGRATION LAB
on:
  push:
    branches: ['codex/lab-01-complete-integration']
    paths: ['tooling/integration-lab/**', '.github/workflows/integration-lab.yml']
  pull_request:
    paths: ['tooling/integration-lab/**', '.github/workflows/integration-lab.yml']
  workflow_dispatch:
    inputs:
      profile:
        description: 'SAFE or additional qualification of an already available authorized emulator'
        type: choice
        options: [SAFE, ANDROID_LAB]
        default: SAFE
      emulator_serial:
        description: 'ANDROID_LAB only; emulator-NNNN, never a personal device'
        type: string
        default: ''
      api:
        description: 'API of the already available emulator'
        type: choice
        options: ['29', '35']
        default: '29'
permissions:
  contents: read
concurrency:
  group: integration-lab-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  lab-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: {fetch-depth: 0, persist-credentials: false, ref: '${{ github.event.pull_request.head.sha || github.sha }}'}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python3 tooling/integration-lab/scripts/check_scope.py
      - run: python3 -m unittest discover -s tooling/integration-lab/tests -v
  campaign:
    needs: lab-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: {fetch-depth: 0, persist-credentials: false, ref: '${{ github.event.pull_request.head.sha || github.sha }}'}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '17'}
      - name: Preserve Java17 before configuring SERVICES Java21
        run: echo "LAB_JAVA_HOME_17=$JAVA_HOME" >> "$GITHUB_ENV"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '21'}
      - run: echo "LAB_JAVA_HOME_21=$JAVA_HOME" >> "$GITHUB_ENV"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with: {packages: platform-tools, log-accepted-android-sdk-licenses: false}
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Existing UNIFIED backup regression dependency only
        run: 'python3 -m pip install --only-binary=:all: -r backup_prototype/requirements.txt'
      - name: Execute real pinned campaign, no model or emulator boot
        env:
          LAB_PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.profile || 'SAFE' }}
          ANDROID_SERIAL: ${{ inputs.emulator_serial || '' }}
          LAB_API: ${{ inputs.api || '29' }}
        run: |
          python3 - <<'PY'
          import os,subprocess,sys
          profile={'SAFE':'safe','ANDROID_LAB':'android_lab'}[os.environ['LAB_PROFILE']]
          sys.exit(subprocess.call([sys.executable,'tooling/integration-lab/lab.py','run','--profile',profile,'--output','.audit-cache/integration-lab','--api',os.environ['LAB_API']]))
          PY
      - name: Independently verify exported evidence even after a failed module
        if: always()
        run: |
          python3 tooling/integration-lab/lab.py verify --archive .audit-cache/integration-lab/evidence.zip
          cd .audit-cache/integration-lab
          sha256sum -c evidence.zip.sha256
          sha256sum -c SHA256SUMS
      - name: Publish actual summary
        if: always()
        run: |
          if [ -f .audit-cache/integration-lab/REPORT.md ]; then cat .audit-cache/integration-lab/REPORT.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: integration-lab-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            .audit-cache/integration-lab/evidence.zip
            .audit-cache/integration-lab/evidence.zip.sha256
            .audit-cache/integration-lab/SHA256SUMS
            .audit-cache/integration-lab/report.json
            .audit-cache/integration-lab/REPORT.md
            .audit-cache/integration-lab/dashboard.html
          retention-days: 90
          if-no-files-found: error
