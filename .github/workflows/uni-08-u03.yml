name: UNI-08 U03 second-wave evidence gate
on:
  push:
    branches: ['feat/uni-08-u03-*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lot2-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.12'
      - name: U03 — verify candidate PR disjoint paths, no release approval
        run: python3 tooling/prefusion/check_lot2.py docs/prefusion/LOT2-EVIDENCE.json
      - name: U03 negative tests
        run: python3 -m unittest discover -s tooling/prefusion/tests -v
      - name: U02 modular workspace remains inactive
        run: |
          python3 workspace/check_plan.py workspace/modular-workspace.proposed.json
          python3 -m unittest discover -s workspace/tests -v
      - name: U01 and U00 contract regressions
        run: |
          python3 -m unittest discover -s tooling/integration/uni08_u01_tests -v
          python3 -m unittest discover -s tooling/integration/uni08_tests -v
