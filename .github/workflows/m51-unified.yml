name: M51 UNIFIED pinned sources and closed gates
on:
  push:
    branches: ['codex/m51-unified-gates']
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Existing backup dependency only, no model or runtime
        run: 'python -m pip install --only-binary=:all: -r backup_prototype/requirements.txt'
      - name: Frozen baseline, historical regression and new evidence safety tests
        run: python -m tooling.v1.run_checks
      - name: Stage bounded text reports only
        if: always()
        run: python -m tooling.v1.package
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: m51-unified-${{ github.sha }}
          path: .audit-cache/m51-ci/public/
          retention-days: 90
          if-no-files-found: error
